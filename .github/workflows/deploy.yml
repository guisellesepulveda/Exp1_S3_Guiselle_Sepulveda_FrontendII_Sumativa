name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # La app se publica en https://<usuario>.github.io/<nombre-repo>/,
      # por eso la ruta base se toma automáticamente del nombre del repositorio.
      - name: Compilar
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # GitHub Pages no conoce las rutas de React Router: si se recarga
      # /inventario respondería 404. Con una copia de index.html como 404.html
      # la app carga igual y React Router muestra la pantalla correcta.
      - name: Fallback para rutas de React Router
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
